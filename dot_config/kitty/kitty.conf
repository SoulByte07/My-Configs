# ============================================
# KITTY CONFIGURATION - CLOUD ENGINEER SETUP
# ============================================

# FONTS & VISUAL
# ============================================
# Use Hack Nerd Font (or JetBrains Mono Nerd, FiraCode Nerd)
font_family      Hack Nerd Font Mono
bold_font        Hack Nerd Font Mono Bold
italic_font      Hack Nerd Font Mono Italic
bold_italic_font Hack Nerd Font Mono Bold Italic

# Font size (adjust to preference)
font_size 12.0

# Disable ligatures at cursor (helps with editing)
# Options: never, cursor, always
disable_ligatures cursor

# ============================================
# PERFORMANCE OPTIMIZATION
# ============================================
# Reduce CPU usage on battery
# Higher values = less CPU usage, lower latency
sync_to_monitor yes

# Update delay: 16.67ms = 60 FPS (smooth scrolling)
input_delay 1
repaint_delay 10

# ============================================
# WINDOW & PADDING
# ============================================
window_padding_width 8
window_margin_width 0

# Hide title bar and use system decorations
hide_window_decorations yes

# Enable scrollback (for searching with Ctrl+Shift+H)
scrollback_lines 10000

# ============================================
# TABS & LAYOUT
# ============================================
# Use compact tab bar
#tab_bar_style compact
tab_bar_margin_height 0.0 0.0

# Keyboard shortcuts for tabs
map ctrl+t new_tab_with_cwd
map ctrl+w close_tab
map ctrl+right next_tab
map ctrl+left previous_tab

# ============================================
# KEYBINDINGS - PRODUCTIVITY
# ============================================

# Open new window with current working directory
map ctrl+enter new_window_with_cwd

# Close window
map ctrl+shift+q close_window

# Create new OS window
map ctrl+alt+n new_os_window_with_cwd

# Search in scrollback with fzf (requires fzf installed)
map ctrl+shift+f launch --type=overlay fzf --multi --no-sort

# ============================================
# MOUSE & SELECTION
# ============================================
# Copy to clipboard on selection
copy_on_select clipboard

# Hide mouse cursor while typing (DevOps preference)
hide_mouse_cursor yes

# ============================================
# COLORS - TOKYO NIGHT THEME (Modern, Professional)
# ============================================
# Background and foreground colors
background           #1a1b26
foreground           #c0caf5

# Cursor
cursor               #c0caf5
cursor_text_color    #1a1b26

# Selection colors (when selecting text)
selection_background #364a82
selection_foreground #c0caf5

# Pane separator color (for split windows)
active_border_color  #7aa2f7
inactive_border_color #565f89

# ============================================
# SHELLS & ENVIRONMENT
# ============================================
# Use Zsh as the shell
shell /bin/zsh

# Clear terminal on new window
clear_all_shortcuts yes

# ============================================
# ADVANCED - BATTERY OPTIMIZATION
# ============================================
# For laptop users: Reduce animation smoothness to save battery
# Uncomment to enable on battery only
# action_deactivation_delay 0.5

# ============================================
# KITTY PROTOCOL SUPPORT
# ============================================
# Enable kitty's advanced features
enable_kitty_keyboard yes

# ============================================
# IMAGE PROTOCOL (For image previews in terminal)
# ============================================
# Enable displaying images in terminal (great for previewing with fzf-tab)
allow_remote_control yes



# ============================================
# CLIPBOARD & PASTE CONFIGURATION
# ============================================

# Default paste from clipboard
map ctrl+shift+v paste_from_clipboard

# Alternative: Paste from primary selection (Linux specific)
map ctrl+shift+s paste_from_selection

# Optional: Paste from shift+insert (traditional Linux)
map shift+insert paste_from_selection

# Copy to clipboard on mouse select
copy_on_select clipboard

# Clear selection on clipboard loss
clear_selection_on_clipboard_loss yes

# Paste actions - confirm before pasting code/large content
paste_actions quote-urls-at-prompt,confirm



