# Commands and Apps to be executed at launch

$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts

$wallDIR=$HOME/Pictures/wallpapers
$lock = $scriptsDir/LockScreen.sh
$SwwwRandom = $UserScripts/WallpaperAutoChange.sh
$livewallpaper=""

# wallpaper stuff 
exec-once = swww-daemon --format xrgb
#exec-once = mpvpaper '*' -o "load-scripts=no no-audio --loop" $livewallpaper

# wallpaper random
exec-once = $SwwwRandom $wallDIR # random wallpaper switcher every 30 minutes

# Startup
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Polkit (Polkit Gnome / KDE)
exec-once = $scriptsDir/Polkit.sh

# starup apps
exec-once = nm-applet --indicator
exec-once = swaync
#exec-once = ags
#exec-once = blueman-applet
#exec-once = rog-control-center
exec-once = waybar
exec-once = qs # quickshell AGS Desktop Overview alternative

#clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Rainbow borders
#exec-once = $UserScripts/RainbowBorders.sh

# Starting hypridle to start hyprlock
exec-once = hypridle


# Here are list of features available but disabled by default
# exec-once = swww-daemon --format xrgb && swww img $HOME/Pictures/wallpapers/mecha-nostalgia.png  # persistent wallpaper

#gnome polkit for nixos
#exec-once = $scriptsDir/Polkit-NixOS.sh

# xdg-desktop-portal-hyprland (should be auto starting. However, you can force to start)
exec-once = $scriptsDir/PortalHyprland.sh




#================ Mine ================

# Kill any running portals to ensure a clean start
#exec-once = pkill -f xdg-desktop-portal 

# Give a moment for them to die
#exec-once = sleep 1

# Start the hyprland backend
#exec-once = /usr/libexec/xdg-desktop-portal-hyprland

# Give the backend a moment to register
#exec-once = sleep 1

# Start the main portal service
#exec-once = /usr/libexec/xdg-desktop-portal


# Start break reminder
exec-once = flatpak run io.github.slgobinath.SafeEyes


# Start espanso for text expansion
#exec-once = espanso daemon


# GNOME key-ring, used to store and unlock the user space apps like Brave
#exec-once = gnome-keyring-daemon --start --components=secrets

# 1. Start the authentication agent
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1

# 2. Start the keyring daemon deeply
exec-once = gnome-keyring-daemon --start --components=secrets,pkcs11,ssh

# 3. CRITICAL: Tell the system (DBus) about these new variables
# This fixes the "ServiceUnknown" error by pushing the environment to the system
exec-once = dbus-update-activation-environment --all
exec-once = sleep 1 && dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
